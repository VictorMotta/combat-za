# gradle.properties: o "painel de controle" do projeto.
# Aqui ficam as VERSÕES e os NOMES. O build.gradle lê esses valores.
# Para atualizar algo, você muda só aqui, num lugar só.

# --- Configurações do próprio Gradle ---
# Memória máxima do Gradle (o Minecraft é grande; 3 GB evita travamentos no build)
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# --- Versões (iguais às do modpack Cobbleverse, conferidas no latest.log) ---
minecraft_version=1.21.1
loader_version=0.18.4
fabric_api_version=0.116.14+1.21.1
fabric_kotlin_version=1.13.13+kotlin.2.4.10
cobblemon_version=1.7.3+1.21.1

# --- Ferramentas de build ---
# Loom 1.13.x é a linha mais nova que roda com Gradle 8 + Java 21
loom_version=1.13.6
# Parchment: nomes legíveis para parâmetros de métodos do Minecraft
parchment_version=2024.11.17

# --- Identidade do mod ---
mod_version=0.2.0-beta.3
maven_group=dev.victor.combatza
archives_base_name=cobblemon_combat_za
